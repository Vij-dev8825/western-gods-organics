    <!--
      Fonts load without blocking the first paint. A plain stylesheet link here
      holds rendering until Google Fonts has been resolved, connected to and
      answered — two extra round trips to another origin before a single pixel
      appears, which on a weak connection is most of the wait. Loading it as
      `print` takes it off the critical path; the onload swap applies it the
      moment it lands, and `display=swap` means text is readable in a fallback
      face until then rather than invisible. The <noscript> copy keeps the
      fonts working where scripts don't run.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap"
      media="print"
      onload="this.media='all';this.onload=null"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
